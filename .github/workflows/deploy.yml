# SIMMS CI / deploy
#
#   pull request -> checks + Vercel preview of the frontend
#   push to main -> checks + frontend to Vercel (production)
#                           + backend to Render (deploy hook)
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN            vercel.com -> Account Settings -> Tokens
#   VERCEL_ORG_ID           .vercel/project.json "orgId" after `vercel link`
#   VERCEL_PROJECT_ID       .vercel/project.json "projectId"
#   RENDER_DEPLOY_HOOK_URL  Render -> simms-backend -> Settings -> Deploy Hook
#
# Frontend settings (VITE_API_BASE_URL) live in the Vercel project's
# environment variables; backend settings in the Render dashboard.
# See DEPLOY.md.

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Existing pages still have React-hooks lint findings; report
      # them without blocking deploys.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q .

      - name: App imports and routes load
        env:
          JWT_SECRET_KEY: ci-only-not-a-secret
        run: python -c "import main; print(len(main.app.routes), 'routes')"

  firmware:
    name: Firmware build (sim + hw)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/simms_node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/simms_node/platformio.ini') }}

      - run: pip install platformio

      - run: pio run -e sim -e hw

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      PROD_FLAG: ${{ github.event_name == 'pull_request' && '' || '--prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (see DEPLOY.md)."
            exit 1
          fi

      - run: npm install --global vercel@latest

      # The Vercel project's Root Directory is "frontend"; the CLI
      # applies it, so it runs from the repository root.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build $PROD_FLAG --token=$VERCEL_TOKEN

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Frontend deployed ($VERCEL_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy backend (Render)
    needs: [backend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set RENDER_DEPLOY_HOOK_URL (see DEPLOY.md)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "### Backend deploy triggered on Render" >> "$GITHUB_STEP_SUMMARY"
