; SIMMS classroom IoT node.
;
;   env:sim  Wokwi simulation (knobs/switches stand in for the
;            PZEM-004T circuit meters and the camera)
;   env:hw   real ESP32 + PZEM-004T v3 meters (LIGHTS, FANS, MAIN) + DHT11
;
; Build:  pio run -e sim        (then F1 -> "Wokwi: Start Simulator")
; Flash:  pio run -e hw -t upload

[platformio]
default_envs = sim

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    beegee-tokyo/DHT sensor library for ESPx@^1.19
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9

[env:sim]
build_flags = -DSIMULATION=1

[env:hw]
build_flags = -DSIMULATION=0
lib_deps =
    ${env.lib_deps}
    mandulaj/PZEM-004T-v30@^1.1.2
